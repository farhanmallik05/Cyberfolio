[build]
  command = "npm run build"
  publish = ".next"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://*.dodopayments.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com https://raw.githubusercontent.com https://images.unsplash.com https://*.dodopayments.com; connect-src 'self' https://*.supabase.co https://*.dodopayments.com wss://*.dodopayments.com https://challenges.cloudflare.com; frame-src 'self' https://*.dodopayments.com https://challenges.cloudflare.com;"
